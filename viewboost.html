<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/>

  <title>ViewBoost</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f1a;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    input[type=range]{accent-color:#a855f7;cursor:pointer;width:100%}
    textarea{resize:vertical;font-family:inherit}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0f0f1a}::-webkit-scrollbar-thumb{background:#2d2d4e;border-radius:3px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,.4)}50%{box-shadow:0 0 0 8px rgba(168,85,247,0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    .fade-up{animation:fadeUp .25s ease}.pulse{animation:pulse 1.5s infinite}
    .spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
</head>

<div id="root"></div>

// ── DB ────────────────────────────────────────────────────────────────────────
const DB = {

  saveUsers: u   => localStorage.setItem('vb_users', JSON.stringify(u)),
  currentId: ()  => localStorage.getItem('vb_uid'),
  login:     id  => localStorage.setItem('vb_uid', id),
  logout:    ()  => localStorage.removeItem('vb_uid'),
  campaigns: ()  => JSON.parse(localStorage.getItem('vb_camps')  || 'null'),
  saveCamps: c   => localStorage.setItem('vb_camps', JSON.stringify(c)),
  history:   ()  => JSON.parse(localStorage.getItem('vb_hist')   || '[]'),
  pushHist: e => { const h=DB.history(); h.unshift(e); localStorage.setItem('vb_hist',JSON.stringify(h.slice(0,500))); },
};

const SEED_VERSION = 'v3';
function initDB() {
  // Re-seed if version changed (picks up new user balances and pricing)
  if (localStorage.getItem('vb_seed') !== SEED_VERSION) {
    DB.saveUsers(SEED_USERS);
    DB.saveCamps(SEED_CAMPAIGNS);
    localStorage.setItem('vb_hist', JSON.stringify(SEED_HISTORY));
    localStorage.removeItem('vb_uid'); // force re-login so balance refreshes
    localStorage.setItem('vb_seed', SEED_VERSION);
  }
}
initDB();

const RING_R=54, RING_CIRC=2*Math.PI*RING_R;
function extractVideoId(url=''){const m=url.match(/(?:[?&]v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}
function initials(n=''){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function timeAgo(ts){const d=Date.now()-ts,m=60e3,h=3600e3,day=864e5;if(d<m)return'just now';if(d<h)return`${Math.floor(d/m)}m ago`;if(d<day)return`${Math.floor(d/h)}h ago`;return`${Math.floor(d/day)}d ago`;}

const Trophy    = p=><Ic {...p} ch={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></>}/>;

// ── Login Screen ──────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [mode,setMode]=useState('login');
  const [name,setName]=useState('');
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  function submit(e){
    e.preventDefault(); setErr('');
    if(mode==='login'){
      const u=DB.users().find(u=>u.email===email&&u.password===pass);
      if(!u){setErr('Invalid email or password.');return;}
      DB.login(u.id); onLogin(u);
    } else {
      if(!name.trim()){setErr('Please enter your name.');return;}
      if(DB.users().find(u=>u.email===email)){setErr('Email already registered.');return;}
      const u={id:`u_${Date.now()}`,name:name.trim(),email,password:pass,points:2000,createdAt:Date.now(),signupBonus:true};
      const users=DB.users(); users.push(u); DB.saveUsers(users);
      DB.login(u.id); onLogin(u);
    }
  }
  function demoLogin(){
    setLoading(true);
    setTimeout(()=>{const u=DB.users().find(u=>u.id==='u_demo');if(u){DB.login(u.id);onLogin(u);}setLoading(false);},500);
  }
  const inp=(val,set,type,ph)=>(
    <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} required
      style={{width:'100%',padding:'12px 16px',borderRadius:10,border:'1px solid rgba(255,255,255,.1)',background:'#0d0d1f',color:'#fff',fontSize:14,outline:'none',fontFamily:'inherit',marginBottom:12}}/>
  );
  return (
    <div className="fade-up" style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0f0f1a',padding:24}}>
      <div style={{width:'100%',maxWidth:420}}>
        <div style={{textAlign:'center',marginBottom:36}}>
          <div style={{width:58,height:58,borderRadius:14,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:14,boxShadow:'0 0 32px rgba(168,85,247,.4)'}}>
            <Play s={26} c="#fff" fill="#fff"/>
          </div>
          <div style={{fontSize:28,fontWeight:800,color:'#fff',letterSpacing:'-0.5px'}}>View<span style={{color:'#a855f7'}}>Boost</span></div>
          <div style={{fontSize:14,color:'#64748b',marginTop:6}}>Earn points. Grow your channel.</div>
          {mode==='register'&&<div style={{marginTop:12,padding:'8px 16px',background:'linear-gradient(135deg,rgba(245,158,11,.15),rgba(168,85,247,.15))',border:'1px solid rgba(245,158,11,.35)',borderRadius:10,display:'inline-flex',alignItems:'center',gap:7,fontSize:13,color:'#f59e0b',fontWeight:700}}>🎁 Sign up and get <span style={{color:'#fff'}}>2,000 points FREE!</span></div>}
        </div>
        <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.07)',borderRadius:18,padding:28}}>
          <h2 style={{fontSize:18,fontWeight:700,color:'#fff',marginBottom:22}}>{mode==='login'?'Sign in to your account':'Create your account'}</h2>
          <form onSubmit={submit}>
            {mode==='register'&&inp(name,setName,'text','Full name')}
            {inp(email,setEmail,'email','Email address')}
            {inp(pass,setPass,'password','Password')}
            {err&&<div style={{color:'#f87171',fontSize:13,marginBottom:12,padding:'8px 12px',background:'rgba(248,113,113,.1)',borderRadius:8}}>{err}</div>}
            <button type="submit" style={{width:'100%',padding:'13px',borderRadius:11,border:'none',background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontWeight:700,fontSize:15,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 0 24px rgba(168,85,247,.35)',marginBottom:12}}>
              {mode==='login'?'Sign In':'Create Account'}
            </button>
          </form>
          <button onClick={demoLogin} disabled={loading} style={{width:'100%',padding:'12px',borderRadius:11,border:'1px solid rgba(34,211,238,.3)',background:'rgba(34,211,238,.06)',color:'#22d3ee',fontWeight:600,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
            <Zap s={14} c="#22d3ee"/> {loading?'Loading…':'Try Demo Account'}
          </button>
          <div style={{textAlign:'center',fontSize:13,color:'#64748b'}}>
            {mode==='login'?"Don't have an account? ":"Already have an account? "}
            <span onClick={()=>{setMode(mode==='login'?'register':'login');setErr('');}} style={{color:'#a855f7',cursor:'pointer',fontWeight:600}}>
              {mode==='login'?'Sign Up':'Sign In'}
            </span>
          </div>
        </div>
        <div style={{textAlign:'center',marginTop:14,fontSize:11,color:'#374151'}}>Demo: demo@viewboost.com / demo123</div>
      </div>
    </div>
  );
}

// ── Header ────────────────────────────────────────────────────────────────────
function Header({ user, points, onLogout }) {
  const [open,setOpen]=useState(false);
  return (
    <header style={{background:'#13132a',borderBottom:'1px solid rgba(255,255,255,.08)',padding:'0 24px',position:'sticky',top:0,zIndex:100}}>
      <div style={{maxWidth:960,margin:'0 auto',height:62,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:30,height:30,borderRadius:7,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Play s={14} c="#fff" fill="#fff"/>
          </div>
          <span style={{fontWeight:800,fontSize:19,letterSpacing:'-0.5px',color:'#fff'}}>View<span style={{color:'#a855f7'}}>Boost</span></span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:6,background:'linear-gradient(135deg,#1e1140,#1a1a2e)',border:'1px solid rgba(168,85,247,.25)',borderRadius:999,padding:'5px 14px',boxShadow:'0 0 14px rgba(168,85,247,.18)'}}>
            <Coins s={14} c="#f59e0b"/><span style={{fontWeight:700,fontSize:14,color:'#fff'}}>{points.toLocaleString()}</span><span style={{color:'#94a3b8',fontSize:11}}>pts</span>
          </div>
          <div style={{position:'relative'}}>
            <button onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,background:'#1a1a2e',border:'1px solid rgba(255,255,255,.1)',borderRadius:999,padding:'5px 12px 5px 5px',cursor:'pointer'}}>
              <div style={{width:28,height:28,borderRadius:999,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>{initials(user.name)}</div>
              <span style={{fontSize:13,fontWeight:600,color:'#fff',maxWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name.split(' ')[0]}</span>
            </button>
            {open&&(
              <div style={{position:'absolute',right:0,top:'calc(100% + 8px)',background:'#1a1a2e',border:'1px solid rgba(255,255,255,.08)',borderRadius:12,padding:8,minWidth:160,zIndex:200,boxShadow:'0 8px 32px rgba(0,0,0,.4)'}}>
                <div style={{padding:'7px 12px',fontSize:11,color:'#64748b',borderBottom:'1px solid rgba(255,255,255,.06)',marginBottom:4}}>{user.email}</div>
                <button onClick={()=>{setOpen(false);onLogout();}} style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'none',background:'transparent',color:'#f87171',fontSize:13,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:8,fontWeight:600}}>
                  <LogOut s={13} c="#f87171"/> Sign Out
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </header>
  );
}

// ── TabBar ────────────────────────────────────────────────────────────────────

    <div style={{display:'flex',justifyContent:'center',padding:'18px 0 0'}}>
      <div style={{display:'inline-flex',background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:999,padding:4,gap:4}}>
        {tabs.map(t=>{

function TaskBadge({ taskType, sm }) {

// ── Shared: TimerRing ─────────────────────────────────────────────────────────
function TimerRing({ timeLeft, totalTime, done }) {
  const p=totalTime>0?timeLeft/totalTime:0, off=RING_CIRC*(1-p), col=done?'#a855f7':'#22d3ee';
  return (
    <div style={{position:'relative',width:112,height:112}}>
      <svg width="112" height="112" style={{transform:'rotate(-90deg)'}}>
        <circle cx="56" cy="56" r={RING_R} fill="none" stroke="#1a1a2e" strokeWidth="7"/>
        <circle cx="56" cy="56" r={RING_R} fill="none" stroke={col} strokeWidth="7" strokeLinecap="round" strokeDasharray={RING_CIRC} strokeDashoffset={off} style={{transition:'stroke-dashoffset 0.9s linear, stroke 0.3s'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <span style={{fontSize:26,fontWeight:800,color:col,lineHeight:1}}>{timeLeft}</span>
        <span style={{fontSize:9,color:'#64748b',marginTop:3,textTransform:'uppercase',letterSpacing:'0.06em'}}>sec</span>
      </div>
    </div>
  );
}

// ── Buy Modal ─────────────────────────────────────────────────────────────────
function BuyModal({ pkg, user, setUser, onClose }) {
  const [phase, setPhase] = useState('confirm'); // confirm | processing | success
  function handleBuy() {
    setPhase('processing');
    setTimeout(() => {
      const users=DB.users(); const idx=users.findIndex(u=>u.id===user.id);
      if(idx>=0){users[idx].points+=pkg.pts;DB.saveUsers(users);setUser({...user,points:user.points+pkg.pts});}
      setPhase('success');
    }, 1600);
  }
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="fade-up" style={{background:'#1a1a2e',border:`1px solid ${pkg.accent}40`,borderRadius:18,padding:28,width:'100%',maxWidth:380,textAlign:'center'}}>
        {phase==='confirm'&&<>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          <h3 style={{fontSize:20,fontWeight:800,color:'#fff',marginBottom:6}}>{pkg.name} Pack</h3>
          <div style={{fontSize:36,fontWeight:800,color:pkg.accent,marginBottom:4}}>${pkg.price}</div>
          <div style={{fontSize:13,color:'#64748b',marginBottom:20}}>You'll receive <strong style={{color:'#fff'}}>{pkg.pts.toLocaleString()} points</strong></div>
          <div style={{background:'#0f0f1a',borderRadius:10,padding:'12px 16px',marginBottom:20,textAlign:'left'}}>
            {pkg.features.map(f=>(
              <div key={f} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,fontSize:13,color:'#94a3b8'}}>
                <Check s={13} c="#4ade80"/> {f}
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={onClose} style={{flex:1,padding:'12px',borderRadius:10,border:'1px solid rgba(255,255,255,.1)',background:'transparent',color:'#94a3b8',cursor:'pointer',fontFamily:'inherit',fontWeight:600,fontSize:14}}>Cancel</button>
            <button onClick={handleBuy} style={{flex:2,padding:'12px',borderRadius:10,border:'none',background:`linear-gradient(135deg,${pkg.accent},${pkg.accent}99)`,color:'#fff',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:14,boxShadow:`0 0 20px ${pkg.accent}44`}}>
              Confirm Purchase
            </button>
          </div>
          <div style={{fontSize:11,color:'#374151',marginTop:12}}>⚡ Demo mode — no real charge. Points added instantly.</div>
        </>}
        {phase==='processing'&&<>
          <div style={{marginBottom:20,marginTop:10}}><div className="spinner" style={{width:48,height:48,margin:'0 auto',borderWidth:4}}/></div>
          <h3 style={{fontSize:18,fontWeight:700,color:'#fff',marginBottom:8}}>Processing…</h3>
          <p style={{fontSize:13,color:'#64748b'}}>Securing your purchase</p>
        </>}
        {phase==='success'&&<>
          <div style={{fontSize:52,marginBottom:12}}>🎉</div>
          <h3 style={{fontSize:22,fontWeight:800,color:'#4ade80',marginBottom:8}}>Purchase Complete!</h3>
          <p style={{fontSize:14,color:'#94a3b8',marginBottom:6}}><strong style={{color:'#fff',fontSize:22}}>{pkg.pts.toLocaleString()}</strong> points added to your balance</p>
          <p style={{fontSize:13,color:'#64748b',marginBottom:20}}>New balance: {(user.points).toLocaleString()} pts</p>
          <button onClick={onClose} style={{width:'100%',padding:'13px',borderRadius:11,border:'none',background:'linear-gradient(135deg,#4ade80,#16a34a)',color:'#fff',fontWeight:700,fontSize:15,cursor:'pointer',fontFamily:'inherit'}}>
            Start Promoting 🚀
          </button>
        </>}
      </div>
    </div>
  );
}

function EarnTab({ user, setUser, campaigns, activeTask, setActiveTask }) {
  const [timeLeft,setTimeLeft]=useState(0);
  const [timerDone,setTimerDone]=useState(false);
  const [subStep,setSubStep]=useState('idle');
  const [comment,setComment]=useState('');
  const [claimed,setClaimed]=useState(false);
  const intRef=useRef(null);

  useEffect(()=>{
    if(!activeTask)return;
    setTimeLeft(activeTask.watchDuration);setTimerDone(false);setSubStep('idle');setComment('');setClaimed(false);
  },[activeTask?.id]);

  useEffect(()=>{
    if(!activeTask||timerDone||claimed){clearInterval(intRef.current);return;}
    clearInterval(intRef.current);
    intRef.current=setInterval(()=>setTimeLeft(t=>Math.max(0,t-1)),1000);
    return()=>clearInterval(intRef.current);
  },[activeTask?.id,timerDone,claimed]);

  useEffect(()=>{if(timeLeft===0&&activeTask&&!timerDone)setTimerDone(true);},[timeLeft]);

  function handleClaim(){
    const d=TASK_DEFS[activeTask.taskType];
    const users=DB.users(); const idx=users.findIndex(u=>u.id===user.id);
    if(idx>=0){users[idx].points+=d.pts;DB.saveUsers(users);setUser({...user,points:user.points+d.pts});}
    DB.pushHist({id:`h_${Date.now()}`,userId:user.id,campaignId:activeTask.id,campaignTitle:activeTask.title,taskType:activeTask.taskType,pts:d.pts,earnedAt:Date.now()});
    setClaimed(true);
  }
  function handleSubscribeOpen(){
    const ch=activeTask.channelUrl||activeTask.url;
    window.open(ch.includes('?')?`${ch}&sub_confirmation=1`:`${ch}?sub_confirmation=1`,'_blank');
    setSubStep('opened');
  }
  function handleBack(){clearInterval(intRef.current);setActiveTask(null);}

  const canClaim=timerDone&&!claimed&&(activeTask?.taskType==='watch'?true:activeTask?.taskType==='subscribe'?subStep==='done':activeTask?.taskType==='comment'?comment.trim().length>0:false);

  // Task selection
  if(!activeTask){
    const avail=campaigns.filter(c=>c.delivered<c.target);
    return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16}}>
        <div>
          <h2 style={{fontSize:17,fontWeight:800,color:'#fff',marginBottom:4}}>Choose a Task to Earn</h2>
          <p style={{fontSize:13,color:'#64748b'}}>Pick a task below. Harder tasks reward more points.</p>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {Object.entries(TASK_DEFS).map(([k,d])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:6,background:'#1a1a2e',border:`1px solid ${d.accent}25`,borderRadius:8,padding:'7px 12px',flex:1,minWidth:150}}>
              <span style={{fontSize:17}}>{d.emoji}</span>
              <div><div style={{fontSize:11,fontWeight:700,color:d.accent}}>{d.label}</div><div style={{fontSize:10,color:'#4b5563'}}>{d.pts} pts</div></div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {avail.length===0
            ? <div style={{textAlign:'center',padding:'40px 0',color:'#4b5563',fontSize:13}}>No tasks available right now.</div>
            : avail.map(c=>(
              <div key={c.id} className="fade-up" style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,padding:'15px 18px',display:'flex',flexDirection:'column',gap:10}}
                onMouseEnter={e=>{const d=TASK_DEFS[c.taskType];e.currentTarget.style.borderColor=`${d.accent}50`;}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.06)';}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <TaskBadge taskType={c.taskType}/>
                  <span style={{fontWeight:800,fontSize:16,color:TASK_DEFS[c.taskType].accent}}>+{TASK_DEFS[c.taskType].pts} pts</span>
                </div>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:'#fff',marginBottom:3}}>{c.title}</div>
                  <div style={{display:'flex',alignItems:'center',gap:4,color:'#64748b',fontSize:12}}><ExtLink s={10} c="#64748b"/>{c.url.slice(0,46)}{c.url.length>46?'…':''}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{display:'flex',alignItems:'center',gap:5,color:'#64748b',fontSize:12}}><Clock s={12} c="#64748b"/>Watch {c.watchDuration}s</span>
                  <button onClick={()=>setActiveTask(c)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:'none',background:`${TASK_DEFS[c.taskType].accent}dd`,color:'#fff',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>
                    <Play s={11} c="#fff" fill="#fff"/> Start Task
                  </button>
                </div>
              </div>
            ))}
        </div>
      </div>
    );
  }

  // Task execution
  const d=TASK_DEFS[activeTask.taskType], videoId=extractVideoId(activeTask.url)||'dQw4w9WgXcQ';
  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <button onClick={handleBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,padding:'6px 12px',color:'#94a3b8',cursor:'pointer',fontFamily:'inherit',fontSize:12}}
          onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='rgba(255,255,255,.3)'}}
          onMouseLeave={e=>{e.currentTarget.style.color='#94a3b8';e.currentTarget.style.borderColor='rgba(255,255,255,.1)'}}>
          <ArrowL s={13} c="currentColor"/> Back
        </button>
        <div style={{display:'flex',alignItems:'center',gap:10}}><TaskBadge taskType={activeTask.taskType}/><span style={{fontWeight:800,fontSize:15,color:d.accent}}>+{d.pts} pts</span></div>
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontWeight:700,fontSize:15,color:'#fff',marginBottom:3}}>{activeTask.title}</div>
        <div style={{fontSize:12,color:'#64748b'}}>{d.desc}</div>
      </div>
      <div style={{borderRadius:14,overflow:'hidden',border:'1px solid rgba(255,255,255,.06)',boxShadow:`0 0 48px ${d.accent}18`,aspectRatio:'16/9',background:'#0d0d1f'}}>
        <iframe key={videoId} src={`https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`} style={{width:'100%',height:'100%',border:'none'}} allow="autoplay; encrypted-media" allowFullScreen/>
      </div>
      <div style={{background:'#13132a',borderRadius:14,border:'1px solid rgba(255,255,255,.06)',padding:'20px 22px',display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <TimerRing timeLeft={timeLeft} totalTime={activeTask.watchDuration} done={timerDone}/>
          <span style={{fontSize:10,color:timerDone?'#4ade80':'#64748b',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>{timerDone?'✓ Done':'Watch Timer'}</span>
        </div>
        <div style={{flex:1,minWidth:200,display:'flex',flexDirection:'column',gap:12}}>
          {activeTask.taskType==='watch'&&(
            <div style={{fontSize:13,color:timerDone?'#4ade80':'#94a3b8',display:'flex',alignItems:'center',gap:6}}>
              {timerDone?<><Check s={14} c="#4ade80"/> Watch complete — claim your reward!</>:<>Keep watching…</>}
            </div>
          )}
          {activeTask.taskType==='subscribe'&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontSize:13,color:timerDone?'#fff':'#4b5563',display:'flex',alignItems:'center',gap:6}}>
                <Bell s={13} c={timerDone?'#a855f7':'#4b5563'}/>{timerDone?'Now subscribe to the channel:':` Subscribe unlocks in ${timeLeft}s…`}
              </div>
              {subStep==='idle'&&(
                <button disabled={!timerDone} onClick={handleSubscribeOpen} className={timerDone?'pulse':''}
                  style={{padding:'11px 16px',borderRadius:10,border:'none',fontFamily:'inherit',cursor:timerDone?'pointer':'not-allowed',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:8,background:timerDone?'linear-gradient(135deg,#ff0000,#cc0000)':'#1f2937',color:timerDone?'#fff':'#4b5563',boxShadow:timerDone?'0 0 20px rgba(255,0,0,.3)':'none',transition:'all .2s'}}>
                  <Youtube s={16} c="white"/> {timerDone?'▶ Subscribe on YouTube':`Locked — watch ${timeLeft}s more`}
                </button>
              )}
              {subStep==='opened'&&(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <div style={{fontSize:12,color:'#94a3b8',padding:'8px 12px',background:'rgba(168,85,247,.08)',borderRadius:8,border:'1px solid rgba(168,85,247,.2)'}}>✅ YouTube opened. Subscribe, then confirm below.</div>
                  <div style={{display:'flex',gap:8}}>
                    <button onClick={()=>setSubStep('done')} style={{flex:1,padding:'10px',borderRadius:9,border:'none',background:'linear-gradient(135deg,#16a34a,#15803d)',color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                      <Check s={13} c="#fff"/> Yes, Subscribed
                    </button>
                    <button onClick={()=>setSubStep('idle')} style={{padding:'10px 14px',borderRadius:9,border:'1px solid rgba(255,255,255,.1)',background:'transparent',color:'#94a3b8',fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Not yet</button>
                  </div>
                </div>
              )}
              {subStep==='done'&&(
                <div style={{fontSize:13,color:'#4ade80',display:'flex',alignItems:'center',gap:6,padding:'10px 14px',background:'rgba(22,163,74,.12)',borderRadius:9,border:'1px solid rgba(74,222,128,.2)'}}>
                  <Check s={14} c="#4ade80"/> Subscribed! Claim your points.
                </div>
              )}
            </div>
          )}
          {activeTask.taskType==='comment'&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:13,color:timerDone?'#fff':'#4b5563',display:'flex',alignItems:'center',gap:6}}>
                <MsgSq s={13} c={timerDone?'#f59e0b':'#4b5563'}/>{timerDone?'Write your comment:':` Comment unlocks in ${timeLeft}s…`}
              </div>
              <textarea disabled={!timerDone} value={comment} onChange={e=>setComment(e.target.value)}
                placeholder={timerDone?'Write a genuine comment…':'Waiting for watch timer…'} rows={3}
                style={{padding:'10px 12px',borderRadius:8,border:`1px solid ${timerDone&&comment.trim()?'rgba(245,158,11,.5)':'rgba(255,255,255,.1)'}`,background:timerDone?'#0f0f1a':'#0a0a14',color:timerDone?'#fff':'#374151',fontSize:13,outline:'none',width:'100%'}}/>
            </div>
          )}
          <button onClick={handleClaim} disabled={!canClaim} style={{padding:'12px',borderRadius:11,border:'none',fontFamily:'inherit',fontWeight:700,fontSize:15,marginTop:4,cursor:canClaim?'pointer':'not-allowed',background:claimed?'rgba(22,163,74,.2)':canClaim?`linear-gradient(135deg,${d.accent},${d.accent}99)`:'#1f2937',color:claimed?'#4ade80':canClaim?'#fff':'#4b5563',boxShadow:canClaim?`0 0 22px ${d.accent}44`:'none',transition:'all .2s'}}>
            {claimed?`✓ Claimed +${d.pts} pts!`:`Claim ${d.pts} Points`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Promote Tab ───────────────────────────────────────────────────────────────
function PromoteTab({ user, setUser, campaigns, setCampaigns }) {
  const [url,setUrl]=useState('');
  const [chan,setChan]=useState('');
  const [type,setType]=useState('watch');
  const [dur,setDur]=useState(30);
  const [views,setViews]=useState(100);
  const d=TASK_DEFS[type], cost=views*d.costPerView;
  const can=url.trim().length>0&&(type==='watch'||chan.trim().length>0)&&user.points>=cost;

  function launch(){
    if(!can)return;
    const c={id:`c_${Date.now()}`,ownerId:user.id,url:url.trim(),channelUrl:chan.trim()||url.trim(),
      title:`My Video #${campaigns.filter(c=>c.ownerId===user.id).length+1}`,target:views,delivered:0,taskType:type,watchDuration:dur,createdAt:Date.now()};
    const updated=[c,...campaigns]; setCampaigns(updated); DB.saveCamps(updated);
    const users=DB.users(); const idx=users.findIndex(u=>u.id===user.id);
    if(idx>=0){users[idx].points-=cost;DB.saveUsers(users);setUser({...user,points:user.points-cost});}
    setUrl('');setChan('');setType('watch');setDur(30);setViews(100);
  }
  const lbl=(t,s)=><div style={{marginBottom:8}}><label style={{fontSize:13,color:'#94a3b8',fontWeight:600}}>{t}</label>{s&&<span style={{fontSize:11,color:'#4b5563',marginLeft:6}}>{s}</span>}</div>;
  const ti=(val,set,ph)=><input type="text" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={{width:'100%',padding:'11px 14px',borderRadius:9,border:'1px solid rgba(255,255,255,.1)',background:'#0f0f1a',color:'#fff',fontSize:13,outline:'none',fontFamily:'inherit',marginBottom:16}}/>;
  const mine=campaigns.filter(c=>c.ownerId===user.id);

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:22}}>
      <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:16,padding:22}}>
        <h2 style={{fontSize:17,fontWeight:700,color:'#fff',marginBottom:18,display:'flex',alignItems:'center',gap:8}}><Rocket s={17} c="#a855f7"/> Launch a Campaign</h2>
        {lbl('YouTube Video URL','(required)')}{ti(url,setUrl,'https://youtube.com/watch?v=...')}
        {lbl('Your Channel URL',type!=='watch'?'(required)':'(optional)')}{ti(chan,setChan,'https://youtube.com/@YourChannel')}
        <div style={{marginBottom:18}}>
          {lbl('Task Type for Viewers')}
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {Object.entries(TASK_DEFS).map(([k,td])=>{const a=type===k;return(
              <div key={k} onClick={()=>setType(k)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:9,border:`1px solid ${a?td.accent+'60':'rgba(255,255,255,.07)'}`,background:a?`${td.accent}10`:'#0f0f1a',cursor:'pointer',transition:'all .15s'}}>
                <div style={{display:'flex',alignItems:'center',gap:9}}><span style={{fontSize:18}}>{td.emoji}</span><div><div style={{fontWeight:700,fontSize:13,color:a?td.accent:'#fff'}}>{td.label}</div><div style={{fontSize:11,color:'#4b5563'}}>{td.desc}</div></div></div>
                <div style={{textAlign:'right'}}><div style={{fontWeight:800,fontSize:13,color:a?td.accent:'#64748b'}}>{td.costPerView} pts/view</div><div style={{fontSize:10,color:'#4b5563'}}>earns {td.pts} pts</div></div>
              </div>
            );})}
          </div>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <label style={{fontSize:13,color:'#94a3b8',fontWeight:600,display:'flex',alignItems:'center',gap:5}}><Clock s={12} c="#94a3b8"/> Watch Time</label>
            <span style={{fontSize:13,fontWeight:700,color:'#22d3ee'}}>{dur}s</span>
          </div>
          <input type="range" min={15} max={120} step={15} value={dur} onChange={e=>setDur(Number(e.target.value))}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:10,color:'#374151'}}>{[15,30,45,60,75,90,105,120].map(v=><span key={v}>{v}s</span>)}</div>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <label style={{fontSize:13,color:'#94a3b8',fontWeight:600,display:'flex',alignItems:'center',gap:5}}><Eye s={12} c="#94a3b8"/> Views to Buy</label>
            <span style={{fontSize:13,fontWeight:700,color:'#22d3ee'}}>{views}</span>
          </div>
          <input type="range" min={10} max={500} step={10} value={views} onChange={e=>setViews(Number(e.target.value))}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:10,color:'#374151'}}><span>10</span><span>500</span></div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#0f0f1a',borderRadius:9,padding:'11px 14px',marginBottom:18}}>
          <div><div style={{fontSize:11,color:'#4b5563'}}>Total cost</div><div style={{fontSize:11,color:'#374151'}}>{views} × {d.costPerView} pts</div></div>
          <span style={{fontWeight:800,fontSize:20,color:cost>user.points?'#ef4444':d.accent,display:'flex',alignItems:'center',gap:6}}><Coins s={15} c="#f59e0b"/>{cost.toLocaleString()} pts</span>
        </div>
        <button onClick={launch} disabled={!can} style={{width:'100%',padding:'13px',borderRadius:11,border:'none',fontFamily:'inherit',fontWeight:700,fontSize:15,cursor:can?'pointer':'not-allowed',background:can?`linear-gradient(135deg,${d.accent},${d.accent}99)`:'#1f2937',color:can?'#fff':'#4b5563',boxShadow:can?`0 0 24px ${d.accent}44`:'none',transition:'all .2s'}}>
          {!url.trim()?'Paste a URL to continue':(type!=='watch'&&!chan.trim())?'Add your channel URL':user.points<cost?'Not enough points':`🚀 Launch — ${cost.toLocaleString()} pts`}
        </button>
      </div>
      {mine.length>0&&(
        <div>
          <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><BarChart s={14} c="#22d3ee"/> My Active Campaigns</h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>{mine.map(c=><CampaignCard key={c.id} campaign={c}/>)}</div>
        </div>
      )}
    </div>
  );
}

// ── Dashboard Tab ─────────────────────────────────────────────────────────────
function DashboardTab({ user, campaigns }) {
  const history=DB.history().filter(h=>h.userId===user.id);
  const mine=campaigns.filter(c=>c.ownerId===user.id);
  const totalEarned=history.reduce((s,h)=>s+h.pts,0);
  const active=mine.filter(c=>c.delivered<c.target).length;
  const icons={watch:'👁️',subscribe:'🔔',comment:'💬'};
  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:22}}>
      <div style={{background:'linear-gradient(135deg,#1e1140,#1a1a2e)',border:'1px solid rgba(168,85,247,.2)',borderRadius:14,padding:'20px 22px',display:'flex',alignItems:'center',gap:16}}>
        <div style={{width:52,height:52,borderRadius:999,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:800,color:'#fff',flexShrink:0}}>{initials(user.name)}</div>
        <div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>Welcome back, {user.name.split(' ')[0]}! 👋</div><div style={{fontSize:12,color:'#94a3b8',marginTop:2}}>Member since {fmtDate(user.createdAt)}</div></div>
        <div style={{marginLeft:'auto',textAlign:'right'}}><div style={{fontSize:22,fontWeight:800,color:'#f59e0b',display:'flex',alignItems:'center',gap:6}}><Coins s={18} c="#f59e0b"/>{user.points.toLocaleString()}</div><div style={{fontSize:11,color:'#64748b'}}>current balance</div></div>
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        {[['🏆','Total Pts Earned',totalEarned.toLocaleString(),'#f59e0b'],['✅','Tasks Completed',history.length,'#4ade80'],['🚀','Active Campaigns',active,'#a855f7'],['📅','Total Campaigns',mine.length,'#22d3ee']].map(([ic,lb,val,col])=>(
          <div key={lb} style={{flex:1,minWidth:130,background:'#1a1a2e',border:`1px solid ${col}25`,borderRadius:12,padding:'16px',textAlign:'center'}}>
            <div style={{fontSize:24,marginBottom:6}}>{ic}</div>
            <div style={{fontSize:22,fontWeight:800,color:col}}>{val}</div>
            <div style={{fontSize:11,color:'#64748b',marginTop:3}}>{lb}</div>
          </div>
        ))}
      </div>
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><Trophy s={14} c="#f59e0b"/> Earnings History</h3>
        {history.length===0
          ? <div style={{textAlign:'center',padding:'28px 0',color:'#374151',fontSize:13}}>No earnings yet. Complete tasks to start earning!</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {history.slice(0,20).map(h=>(
                <div key={h.id} style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.05)',borderRadius:10,padding:'11px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:18}}>{icons[h.taskType]||'⚡'}</span>
                    <div><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{h.campaignTitle}</div><div style={{fontSize:11,color:'#64748b',marginTop:1}}>{TASK_DEFS[h.taskType]?.label} · {fmtDate(h.earnedAt)} {fmtTime(h.earnedAt)}</div></div>
                  </div>
                  <span style={{fontWeight:800,fontSize:14,color:'#4ade80',whiteSpace:'nowrap'}}>+{h.pts} pts</span>
                </div>
              ))}
            </div>}
      </div>
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><BarChart s={14} c="#22d3ee"/> My Campaign History</h3>
        {mine.length===0
          ? <div style={{textAlign:'center',padding:'28px 0',color:'#374151',fontSize:13}}>No campaigns yet. Go to Promote to launch one!</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>{mine.map(c=>(
              <div key={c.id}><CampaignCard campaign={c} compact/><div style={{fontSize:10,color:'#374151',marginTop:3,paddingLeft:4}}>Created {fmtDate(c.createdAt)}</div></div>
            ))}</div>}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('discover');
  const [camps,setCamps]=useState(DB.campaigns()||SEED_CAMPAIGNS);
  const [task,setTask]=useState(null);

  useEffect(()=>{
    const id=DB.currentId();
    if(id){const u=DB.users().find(u=>u.id===id);if(u)setUser(u);}
  },[]);

  function setActiveTask(t){setTask(t);if(t)setTab('earn');}

  if(!user) return <LoginScreen onLogin={u=>{setUser(u);setTab('discover');}}/>;

  return (
    <div style={{background:'#0f0f1a',minHeight:'100vh',color:'#fff'}}>
      <Header user={user} points={user.points} onLogout={()=>{DB.logout();setUser(null);setTab('discover');setTask(null);}}/>
      <div style={{maxWidth:960,margin:'0 auto',padding:'0 20px 64px'}}>
        <TabBar activeTab={tab} setActiveTab={t=>{setTab(t);if(t!=='earn')setTask(null);}}/>
        <div style={{marginTop:22}}>
          {tab==='discover'  && <DiscoverTab user={user} setUser={setUser} campaigns={camps} setActiveTab={setTab} setActiveTask={setActiveTask}/>}
          {tab==='earn'      && <EarnTab user={user} setUser={setUser} campaigns={camps} activeTask={task} setActiveTask={setActiveTask}/>}
          {tab==='promote'   && <PromoteTab user={user} setUser={setUser} campaigns={camps} setCampaigns={setCamps}/>}
          {tab==='dashboard' && <DashboardTab user={user} campaigns={camps}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
