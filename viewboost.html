// ── Direct-fetch auth helpers (bypasses JS client which hangs) ────────────────
const AUTH_HEADERS = { 'Content-Type': 'application/json', 'apikey': SUPA_KEY };

async function authSignIn(email, password) {
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST', headers: AUTH_HEADERS,
    body: JSON.stringify({ email, password }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.message || 'Invalid email or password');
  // Inject session into JS client so DB queries work
  await supa.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
  return d.user;
}

async function authSignUp(email, password, name) {
  const r = await fetch(`${SUPA_URL}/auth/v1/signup`, {
    method: 'POST', headers: AUTH_HEADERS,
    body: JSON.stringify({ email, password, data: { name } }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || d.message || 'Signup failed');
  if (d.session) {
    await supa.auth.setSession({ access_token: d.session.access_token, refresh_token: d.session.refresh_token });
  }
  return d;
}

async function authGetSession() {
  // Read stored session from localStorage directly — no network call needed
  const stored = localStorage.getItem(`sb-rqinoynbezufokewlwny-auth-token`);
  if (!stored) return null;
  try {
    const s = JSON.parse(stored);
    const tok = s?.access_token || s?.currentSession?.access_token;
    const ref = s?.refresh_token || s?.currentSession?.refresh_token;
    if (!tok || !ref) return null;
    // Check if expired — if so, refresh
    const exp = s?.expires_at || s?.currentSession?.expires_at || 0;
    if (exp && exp < Math.floor(Date.now()/1000) + 60) {
      const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST', headers: AUTH_HEADERS,
        body: JSON.stringify({ refresh_token: ref }),
      });
      if (!r.ok) { localStorage.removeItem(`sb-rqinoynbezufokewlwny-auth-token`); return null; }
      const d = await r.json();
      await supa.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
      return d.user;
    }
    await supa.auth.setSession({ access_token: tok, refresh_token: ref });
    // Decode user from JWT
    const payload = JSON.parse(atob(tok.split('.')[1]));
    return { id: payload.sub, email: payload.email, user_metadata: payload.user_metadata || {} };
  } catch(e) { return null; }
}

// ── YouTube Comment API ───────────────────────────────────────────────────────
// Requires a Google Cloud OAuth 2.0 Client ID with YouTube Data API v3 enabled.
// Setup: console.cloud.google.com → APIs & Services → Credentials → OAuth 2.0
// Add your Vercel domain + localhost:3333 as Authorised JavaScript Origins.
const GOOGLE_YT_CLIENT_ID = '218557888562-7e65v2vcn1dn3h7qk0nlt9u3q8j5kf9r.apps.googleusercontent.com';

let _ytTokenClient = null;
let _ytToken       = null;

function initYTAuth() {
  if (!GOOGLE_YT_CLIENT_ID || !window.google?.accounts?.oauth2) return;
  _ytTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_YT_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/youtube.force-ssl',
    callback: () => {},
  });
}

function getYTToken() {
  return new Promise((resolve, reject) => {
    if (!GOOGLE_YT_CLIENT_ID) { reject(new Error('NO_CLIENT_ID')); return; }
    // Wait for GIS to load (loaded async)
    if (!window.google?.accounts?.oauth2) { reject(new Error('GIS_NOT_LOADED')); return; }
    if (!_ytTokenClient) initYTAuth();
    if (!_ytTokenClient) { reject(new Error('TOKEN_CLIENT_FAILED')); return; }
    _ytTokenClient.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error_description || resp.error)); return; }
      _ytToken = resp.access_token;
      resolve(resp.access_token);
    };
    // If we have a valid token already, reuse it
    if (_ytToken) { resolve(_ytToken); return; }
    _ytTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function postCommentToYouTube(videoId, commentText) {
  const token = await getYTToken();
  const res = await fetch('https://www.googleapis.com/youtube/v3/commentThreads?part=snippet', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      snippet: {
        videoId,
        topLevelComment: { snippet: { textOriginal: commentText } },
      },
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    // Token expired — clear and throw so caller can retry once
    if (data.error?.status === 'UNAUTHENTICATED' || res.status === 401) _ytToken = null;
    throw new Error(data.error?.message || 'Failed to post comment to YouTube');
  }
  return data;
}

// Map Supabase campaign row → app shape
function mapCamp(c) {
  return {
    id: c.id, ownerId: c.owner_id, url: c.url, channelUrl: c.channel_url||'',
    title: c.title, target: c.target, delivered: c.delivered,
    taskType: c.task_type, watchDuration: c.watch_duration,
    createdAt: new Date(c.created_at).getTime(),
  };
}
async function fetchCampaigns() {
  const { data } = await supa.from('campaigns').select('*').order('created_at', { ascending: false });
  return (data||[]).map(mapCamp);
}
async function fetchProfile(userId) {
  const { data } = await supa.from('profiles').select('*').eq('id', userId).single();
  return data;
}
async function fetchLeaderboard() {
  const { data } = await supa.from('profiles')
    .select('id, name, points, tasks_completed, total_earned, created_at')
    .order('points', { ascending: false });
  return data || [];
}
async function fetchEarnHistory(userId) {
  const { data } = await supa.from('earn_history')
    .select('*').eq('user_id', userId).order('earned_at', { ascending: false }).limit(100);
  return data || [];
}
async function fetchPurchases(userId) {
  const { data } = await supa.from('purchases')
    .select('*').eq('user_id', userId).order('purchased_at', { ascending: false });
  return data || [];
}
async function savePurchase(userId, pkg) {
  await supa.from('purchases').insert({
    user_id: userId, package_id: pkg.id, package_name: pkg.name,
    pts: pkg.pts, price: pkg.price,
  });
  await supa.from('profiles').update({
    total_purchased: supa.rpc ? undefined : undefined, // incremented server-side below
  }).eq('id', userId);
  // Increment total_purchased in profiles
  await supa.rpc('increment_purchased', { uid: userId, amount: pkg.pts }).catch(() =>
    supa.from('profiles').select('total_purchased').eq('id', userId).single().then(({data}) =>
      supa.from('profiles').update({ total_purchased: (data?.total_purchased||0) + pkg.pts }).eq('id', userId)
    )
  );
}

function extractVideoId(url='') {
  // Handles all YouTube URL formats:
  // - youtube.com/watch?v=ID
  // - youtu.be/ID
  // - youtube.com/embed/ID
  // - youtube.com/shorts/ID  ← Shorts
  // - youtube.com/live/ID    ← Live streams
  // - youtube.com/v/ID       ← Old embed
  const patterns = [
    /[?&]v=([A-Za-z0-9_-]{11})/,
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /\/embed\/([A-Za-z0-9_-]{11})/,
    /\/shorts\/([A-Za-z0-9_-]{11})/,
    /\/live\/([A-Za-z0-9_-]{11})/,
    /\/v\/([A-Za-z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

// Fallback profile — points deliberately omitted so a failed fetch
// never overwrites the real DB balance with a wrong value.
const DEFAULT_PROFILE = (nameVal, emailVal) => ({
  name: nameVal || emailVal.split('@')[0],
  points: null,          // null = "not loaded yet" — will reload from DB
  tasks_completed: 0, total_earned: 0,

function LoginScreen({ onLogin }) {
  const [mode,    setMode]    = useState('login');
  const [name,    setName]    = useState('');
  const [email,   setEmail]   = useState('');
  const [pass,    setPass]    = useState('');
  const [err,     setErr]     = useState('');
  const [loading, setLoading] = useState(false);
  const [confirm, setConfirm] = useState(false); // email confirmation needed

  async function submit(e) {
    e.preventDefault();
    setErr('');
    if (mode === 'register' && !name.trim()) { setErr('Please enter your name.'); return; }
    setLoading(true);
    try {
      if (mode === 'login') {
        const user = await authSignIn(email, pass);
        const profile = await fetchProfile(user.id).catch(() => null);
        onLogin({ id: user.id, email: user.email, ...(profile || DEFAULT_PROFILE(null, email)) });

      } else {
        const result = await authSignUp(email, pass, name.trim());
        // No session = email confirmation required
        if (!result.session) { setConfirm(true); return; }
        // Give DB trigger 1s to create profile, then load it
        await new Promise(r => setTimeout(r, 1000));
        const profile = await fetchProfile(result.user.id).catch(() => null);
        onLogin({ id: result.user.id, email: result.user.email, ...(profile || DEFAULT_PROFILE(name.trim(), email)) });
      }
    } catch (e) {
      setErr(e.message || 'Something went wrong. Please try again.');
    } finally {
      setLoading(false); // ALWAYS runs no matter what
    }
  }

    <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} required disabled={loading}

  );

    <div className="fade-up" style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0f0f1a',padding:24}}>

          {mode==='register'&&<div style={{marginTop:12,padding:'8px 16px',background:'linear-gradient(135deg,rgba(245,158,11,.15),rgba(168,85,247,.15))',border:'1px solid rgba(245,158,11,.35)',borderRadius:10,display:'inline-flex',alignItems:'center',gap:7,fontSize:13,color:'#f59e0b',fontWeight:700}}>🎁 Sign up &amp; get <span style={{color:'#fff'}}>2,000 points FREE!</span></div>}
        </div>
        <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.07)',borderRadius:18,padding:28}}>

          {/* Email confirmation screen */}
          {confirm ? (
            <div style={{textAlign:'center',padding:'8px 0'}}>
              <div style={{fontSize:48,marginBottom:14}}>📧</div>
              <h2 style={{fontSize:20,fontWeight:800,color:'#fff',marginBottom:8}}>Check your email</h2>
              <p style={{fontSize:13,color:'#94a3b8',lineHeight:1.6,marginBottom:20}}>We sent a confirmation link to <strong style={{color:'#fff'}}>{email}</strong>. Click it to activate your account.</p>
              <button onClick={()=>{setConfirm(false);setMode('login');}} style={{padding:'10px 24px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>
                Back to Sign In
              </button>
            </div>
          ) : (
            <>
              <h2 style={{fontSize:18,fontWeight:700,color:'#fff',marginBottom:22}}>{mode==='login'?'Sign in to your account':'Create your account'}</h2>
              <form onSubmit={submit}>
                {mode==='register'&&inp(name,setName,'text','Full name')}
                {inp(email,setEmail,'email','Email address')}
                {inp(pass,setPass,'password','Password')}
                {err&&<div style={{color:'#f87171',fontSize:13,marginBottom:12,padding:'8px 12px',background:'rgba(248,113,113,.1)',borderRadius:8}}>{err}</div>}
                <button type="submit" disabled={loading} style={{width:'100%',padding:'13px',borderRadius:11,border:'none',background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontWeight:700,fontSize:15,cursor:loading?'wait':'pointer',fontFamily:'inherit',boxShadow:'0 0 24px rgba(168,85,247,.35)',marginBottom:12,opacity:loading?.7:1,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                  {loading&&<div className="spinner" style={{width:16,height:16}}/>}
                  {loading?'Please wait…':mode==='login'?'Sign In':'Create Account'}
                </button>
              </form>
              <div style={{textAlign:'center',fontSize:13,color:'#64748b'}}>
                {mode==='login'?"Don't have an account? ":"Already have an account? "}
                <span onClick={()=>{setMode(mode==='login'?'register':'login');setErr('');setLoading(false);}} style={{color:'#a855f7',cursor:'pointer',fontWeight:600}}>
                  {mode==='login'?'Sign Up':'Sign In'}
                </span>
              </div>
            </>
          )}
        </div>
        <div style={{textAlign:'center',marginTop:14,fontSize:11,color:'#374151'}}>Powered by Supabase Auth · data encrypted at rest</div>
      </div>
    </div>
  );
}

function TimerRing({ timeLeft, totalTime, done }) {

}

// ── Checkout Page ─────────────────────────────────────────────────────────────
function CheckoutPage({ pkg, user, onUpdatePoints, onBack, onSuccess }) {
  const [phase,setPhase]=useState('form');
  const [name,setName]=useState(user.name||'');
  const [email,setEmail]=useState(user.email||'');
  const [card,setCard]=useState('');
  const [expiry,setExpiry]=useState('');
  const [cvv,setCvv]=useState('');
  const [errors,setErrors]=useState({});
  const [steps,setSteps]=useState([]);

  function fmtCard(v){return v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();}
  function fmtExpiry(v){const d=v.replace(/\D/g,'').slice(0,4);return d.length>=3?d.slice(0,2)+'/'+d.slice(2):d;}
  function cardBrand(v){const n=v.replace(/\s/g,'');if(n.startsWith('4'))return'Visa';if(/^5[1-5]/.test(n))return'Mastercard';if(/^3[47]/.test(n))return'Amex';return'Card';}
  function validate(){const e={};if(!name.trim())e.name='Full name is required';if(!email.includes('@'))e.email='Valid email required';if(card.replace(/\s/g,'').length<16)e.card='Enter a valid 16-digit card number';if(expiry.length<5)e.expiry='Enter expiry as MM/YY';if(cvv.length<3)e.cvv='Enter 3-digit CVV';return e;}

  async function handleSubmit(e) {
    e.preventDefault();
    const errs=validate(); if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({}); setPhase('processing');
    const msgs=['Validating card details…','Contacting payment gateway…','Authorising transaction…','Securing your purchase…','Adding points to your account…'];
    msgs.forEach((msg,i)=>setTimeout(()=>setSteps(p=>[...p,msg]),i*500));
    setTimeout(async()=>{
      const newPts=user.points+pkg.pts;
      // Save purchase record + update balance in parallel
      await Promise.all([
        supa.from('profiles').update({ points: newPts }).eq('id', user.id),
        supa.from('purchases').insert({
          user_id: user.id, package_id: pkg.id, package_name: pkg.name,
          pts: pkg.pts, price: pkg.price,
        }),
      ]).catch(()=>{});
      onUpdatePoints(newPts);
      setPhase('success');
    },msgs.length*500+400);
  }

  const iStyle=(f)=>({width:'100%',padding:'13px 16px',borderRadius:10,border:`1px solid ${errors[f]?'#ef4444':'rgba(255,255,255,.12)'}`,background:'#0d0d1f',color:'#fff',fontSize:14,outline:'none',fontFamily:'inherit'});

  if(phase==='success') return (
    <div className="fade-in" style={{minHeight:'100vh',background:'#0f0f1a',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div className="pop-in" style={{textAlign:'center',maxWidth:480}}>
        <div style={{fontSize:72,marginBottom:8,lineHeight:1}}>🎉</div>
        <div style={{display:'flex',justifyContent:'center',gap:6,marginBottom:24,flexWrap:'wrap',fontSize:22}}>
          {['🎊','✨','💫','⭐','🌟'].map((e,i)=><span key={i} style={{animation:`confetti ${0.8+i*0.15}s ease forwards`,display:'inline-block'}}>{e}</span>)}
        </div>
        <h1 style={{fontSize:34,fontWeight:800,color:'#4ade80',marginBottom:8,letterSpacing:'-0.5px'}}>Purchase Complete!</h1>
        <p style={{fontSize:16,color:'#94a3b8',marginBottom:24}}>Your <strong style={{color:'#fff'}}>{pkg.name} Pack</strong> has been activated successfully.</p>
        <div style={{display:'inline-flex',alignItems:'center',gap:12,background:'linear-gradient(135deg,#1e1140,#0f1a1a)',border:'1px solid rgba(74,222,128,.3)',borderRadius:16,padding:'20px 32px',marginBottom:28,boxShadow:'0 0 40px rgba(74,222,128,.15)'}}>
          <Coins s={32} c="#f59e0b"/>
          <div style={{textAlign:'left'}}>
            <div style={{fontSize:36,fontWeight:800,color:'#f59e0b',lineHeight:1}}>+{pkg.pts.toLocaleString()}</div>
            <div style={{fontSize:13,color:'#64748b',marginTop:3}}>points added to your account</div>
          </div>
        </div>
        <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.07)',borderRadius:12,padding:'16px 20px',marginBottom:28,textAlign:'left'}}>
          <div style={{fontSize:11,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Order Summary</div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{fontSize:13,color:'#94a3b8'}}>Package</span><span style={{fontSize:13,color:'#fff',fontWeight:600}}>{pkg.name} Pack</span></div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{fontSize:13,color:'#94a3b8'}}>Points</span><span style={{fontSize:13,color:'#f59e0b',fontWeight:700}}>{pkg.pts.toLocaleString()} pts</span></div>
          <div style={{borderTop:'1px solid rgba(255,255,255,.06)',marginTop:8,paddingTop:8,display:'flex',justifyContent:'space-between'}}><span style={{fontSize:14,color:'#fff',fontWeight:700}}>Total</span><span style={{fontSize:14,color:'#4ade80',fontWeight:800}}>${pkg.price}</span></div>
        </div>
        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
          <button onClick={onSuccess} style={{padding:'14px 32px',borderRadius:12,border:'none',background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontWeight:700,fontSize:15,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 0 24px rgba(168,85,247,.4)'}}>🚀 Start Promoting</button>
          <button onClick={onBack} style={{padding:'14px 24px',borderRadius:12,border:'1px solid rgba(255,255,255,.12)',background:'transparent',color:'#94a3b8',fontWeight:600,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Back to Discover</button>
        </div>
      </div>
    </div>
  );

  if(phase==='processing') return (
    <div className="fade-in" style={{minHeight:'100vh',background:'#0f0f1a',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{textAlign:'center',maxWidth:380}}>
        <div style={{width:72,height:72,border:'4px solid rgba(168,85,247,.2)',borderTopColor:'#a855f7',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 24px'}}/>
        <h2 style={{fontSize:22,fontWeight:800,color:'#fff',marginBottom:8}}>Processing Payment</h2>
        <p style={{fontSize:13,color:'#64748b',marginBottom:28}}>Please wait…</p>
        <div style={{display:'flex',flexDirection:'column',gap:10,textAlign:'left'}}>
          {steps.map((s,i)=><div key={i} className="fade-up" style={{display:'flex',alignItems:'center',gap:10,background:'#1a1a2e',borderRadius:9,padding:'10px 14px',border:'1px solid rgba(255,255,255,.06)'}}><Check s={14} c="#4ade80"/><span style={{fontSize:13,color:'#94a3b8'}}>{s}</span></div>)}
        </div>
      </div>
    </div>
  );

  return (
    <div className="fade-in" style={{minHeight:'100vh',background:'#0f0f1a',color:'#fff'}}>
      <div style={{background:'#13132a',borderBottom:'1px solid rgba(255,255,255,.08)',padding:'0 24px'}}>
        <div style={{maxWidth:960,margin:'0 auto',height:62,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:7,background:'transparent',border:'none',color:'#94a3b8',cursor:'pointer',fontFamily:'inherit',fontSize:14,fontWeight:600}}
            onMouseEnter={e=>e.currentTarget.style.color='#fff'} onMouseLeave={e=>e.currentTarget.style.color='#94a3b8'}>
            <ArrowL s={16} c="currentColor"/> Back to Plans
          </button>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:28,height:28,borderRadius:7,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center'}}><Play s={13} c="#fff" fill="#fff"/></div>
            <span style={{fontWeight:800,fontSize:17,color:'#fff'}}>View<span style={{color:'#a855f7'}}>Boost</span></span>
            <span style={{color:'#4b5563',fontSize:13,marginLeft:4}}>/ Checkout</span>
          </div>
          <div style={{fontSize:12,color:'#4ade80'}}>🔒 Secure Checkout</div>
        </div>
      </div>
      <div style={{maxWidth:900,margin:'0 auto',padding:'36px 20px 64px',display:'grid',gridTemplateColumns:'1fr 360px',gap:32,alignItems:'start'}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,color:'#fff',marginBottom:6}}>Billing Information</h2>
          <p style={{fontSize:13,color:'#64748b',marginBottom:28}}>⚡ Demo mode — no real charge. Any card details accepted.</p>
          <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',gap:20}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div><label style={{display:'block',fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Full Name</label><input className="checkout-input" value={name} onChange={e=>setName(e.target.value)} placeholder="John Smith" style={iStyle('name')}/>{errors.name&&<div style={{fontSize:11,color:'#ef4444',marginTop:5}}>⚠ {errors.name}</div>}</div>
              <div><label style={{display:'block',fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Email</label><input className="checkout-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" style={iStyle('email')}/>{errors.email&&<div style={{fontSize:11,color:'#ef4444',marginTop:5}}>⚠ {errors.email}</div>}</div>
            </div>
            <div><label style={{display:'block',fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Card Number</label>
              <div style={{position:'relative'}}><input className="checkout-input" value={card} onChange={e=>setCard(fmtCard(e.target.value))} placeholder="1234 5678 9012 3456" maxLength={19} style={{...iStyle('card'),paddingRight:80}}/><div style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',fontSize:12,color:'#64748b'}}>💳 {cardBrand(card)}</div></div>
              {errors.card&&<div style={{fontSize:11,color:'#ef4444',marginTop:5}}>⚠ {errors.card}</div>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div><label style={{display:'block',fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Expiry</label><input className="checkout-input" value={expiry} onChange={e=>setExpiry(fmtExpiry(e.target.value))} placeholder="MM/YY" maxLength={5} style={iStyle('expiry')}/>{errors.expiry&&<div style={{fontSize:11,color:'#ef4444',marginTop:5}}>⚠ {errors.expiry}</div>}</div>

// ── Earn Tab ──────────────────────────────────────────────────────────────────
function EarnTab({ user, campaigns, onClaim, activeTask, setActiveTask }) {
  const [timeLeft,  setTimeLeft]  = useState(0);
  const [timerDone, setTimerDone] = useState(false);
  const [subStep,   setSubStep]   = useState('idle');
  const [comment,   setComment]   = useState('');
  const [claimed,   setClaimed]   = useState(false);
  const [ytStatus,  setYtStatus]  = useState('idle'); // idle | posting | posted | failed
  const [ytError,   setYtError]   = useState('');
  const intRef = useRef(null);

  useEffect(()=>{
    if(!activeTask)return;
    setTimeLeft(activeTask.watchDuration);
    setTimerDone(false);setSubStep('idle');
    setComment('');setClaimed(false);
    setYtStatus('idle');setYtError('');
  },[activeTask?.id]);

  useEffect(()=>{
    if(!activeTask||timerDone||claimed){clearInterval(intRef.current);return;}
    clearInterval(intRef.current);
    intRef.current=setInterval(()=>setTimeLeft(t=>Math.max(0,t-1)),1000);
    return()=>clearInterval(intRef.current);
  },[activeTask?.id,timerDone,claimed]);

  useEffect(()=>{if(timeLeft===0&&activeTask&&!timerDone)setTimerDone(true);},[timeLeft]);

  async function handleClaim(){
    if(!canClaim) return;
    const d = TASK_DEFS[activeTask.taskType];

    // For comment tasks — auto-post to YouTube first
    if (activeTask.taskType === 'comment') {
      const vid = extractVideoId(activeTask.url);
      if (vid && GOOGLE_YT_CLIENT_ID) {
        setYtStatus('posting');
        try {
          await postCommentToYouTube(vid, comment.trim());
          setYtStatus('posted');
        } catch(e) {
          // If user cancelled auth or API failed, still allow claim (honour system)
          const msg = e.message === 'NO_CLIENT_ID' || e.message === 'GIS_NOT_LOADED'
            ? null // silently skip — API not configured
            : e.message;
          setYtStatus('failed');
          if (msg) { setYtError(msg); }
        }
      }
    }

    setClaimed(true);
    onClaim(activeTask, d.pts);
  }

  function handleSubscribeOpen(){
    const ch=activeTask.channelUrl||activeTask.url;
    window.open(ch.includes('?')?`${ch}&sub_confirmation=1`:`${ch}?sub_confirmation=1`,'_blank');
    setSubStep('opened');
  }
  function handleBack(){clearInterval(intRef.current);setActiveTask(null);}

  const [filter, setFilter] = useState('all'); // 'all' | 'watch' | 'subscribe' | 'comment'
  const canClaim=timerDone&&!claimed&&(activeTask?.taskType==='watch'?true:activeTask?.taskType==='subscribe'?subStep==='done':comment.trim().length>0);
  const avail=campaigns.filter(c=>c.delivered<c.target);
  const filtered = filter==='all' ? avail : avail.filter(c=>c.taskType===filter);

  const CATS = [
    { id:'all', label:'All Tasks', emoji:'⚡', accent:'#a855f7', count: avail.length },
    ...Object.entries(TASK_DEFS).map(([k,d])=>({ id:k, label:d.label, emoji:d.emoji, accent:d.accent, count: avail.filter(c=>c.taskType===k).length })),
  ];

  if(!activeTask) return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:18}}>

      {/* Header */}
      <div>
        <h2 style={{fontSize:17,fontWeight:800,color:'#fff',marginBottom:4}}>Choose a Task to Earn</h2>
        <p style={{fontSize:13,color:'#64748b'}}>Select a category, then pick a task. All earnings are saved to your Supabase account.</p>
      </div>

      {/* Category filter tabs */}
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {CATS.map(cat=>{
          const active = filter===cat.id;
          return (
            <button key={cat.id} onClick={()=>setFilter(cat.id)} style={{
              display:'flex', alignItems:'center', gap:7,
              padding:'9px 16px', borderRadius:10, border:'none', cursor:'pointer',
              fontFamily:'inherit', fontWeight:600, fontSize:13, transition:'all 200ms',
              background: active ? `linear-gradient(135deg,${cat.accent},${cat.accent}99)` : '#1a1a2e',
              color: active ? '#fff' : '#94a3b8',
              boxShadow: active ? `0 0 18px ${cat.accent}44` : 'none',
              outline: active ? 'none' : `1px solid ${cat.accent}20`,
            }}>
              <span style={{fontSize:16}}>{cat.emoji}</span>
              {cat.label}
              <span style={{
                background: active ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.07)',
                color: active ? '#fff' : '#64748b',
                borderRadius:999, padding:'1px 7px', fontSize:11, fontWeight:700,
              }}>{cat.count}</span>
            </button>
          );
        })}
      </div>

      {/* Points legend for selected category */}
      {filter !== 'all' && (
        <div style={{
          background: `${TASK_DEFS[filter]?.accent}10`,
          border: `1px solid ${TASK_DEFS[filter]?.accent}30`,
          borderRadius:10, padding:'10px 16px',
          display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:8,
        }}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:22}}>{TASK_DEFS[filter]?.emoji}</span>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:'#fff'}}>{TASK_DEFS[filter]?.label}</div>
              <div style={{fontSize:11,color:'#64748b',marginTop:1}}>{TASK_DEFS[filter]?.desc}</div>
            </div>
          </div>
          <div style={{fontWeight:800,fontSize:18,color:TASK_DEFS[filter]?.accent}}>+{TASK_DEFS[filter]?.pts} pts per task</div>
        </div>
      )}

      {/* Task list */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filtered.length===0
          ? <div style={{textAlign:'center',padding:'40px 0',background:'#1a1a2e',borderRadius:14,color:'#4b5563',fontSize:13}}>
              No <strong style={{color:'#94a3b8'}}>{filter==='all'?'':TASK_DEFS[filter]?.label}</strong> tasks available right now.
              {filter!=='all'&&<div style={{marginTop:8}}><span onClick={()=>setFilter('all')} style={{color:'#a855f7',cursor:'pointer',fontWeight:600}}>View all tasks →</span></div>}
            </div>
          : filtered.map(c=>(
            <div key={c.id} className="fade-up" style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,padding:'15px 18px',display:'flex',flexDirection:'column',gap:10}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=`${TASK_DEFS[c.taskType]?.accent||'#a855f7'}50`;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.06)';}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <TaskBadge taskType={c.taskType}/>
                <span style={{fontWeight:800,fontSize:16,color:TASK_DEFS[c.taskType]?.accent}}> +{TASK_DEFS[c.taskType]?.pts} pts</span>
              </div>
              <div><div style={{fontWeight:700,fontSize:14,color:'#fff',marginBottom:3}}>{c.title}</div><div style={{display:'flex',alignItems:'center',gap:4,color:'#64748b',fontSize:12}}><ExtLink s={10} c="#64748b"/>{c.url.slice(0,46)}{c.url.length>46?'…':''}</div></div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{display:'flex',alignItems:'center',gap:5,color:'#64748b',fontSize:12}}><Clock s={12} c="#64748b"/>Watch {c.watchDuration}s</span>
                <button onClick={()=>setActiveTask(c)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:'none',background:`${TASK_DEFS[c.taskType]?.accent||'#a855f7'}dd`,color:'#fff',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>
                  <Play s={11} c="#fff" fill="#fff"/> Start Task
                </button>
              </div>
            </div>
          ))}
      </div>
    </div>
  );

  const d=TASK_DEFS[activeTask.taskType]||TASK_DEFS.watch;
  const videoId=extractVideoId(activeTask.url);
  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <button onClick={handleBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,padding:'6px 12px',color:'#94a3b8',cursor:'pointer',fontFamily:'inherit',fontSize:12}}
          onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='rgba(255,255,255,.3)'}}
          onMouseLeave={e=>{e.currentTarget.style.color='#94a3b8';e.currentTarget.style.borderColor='rgba(255,255,255,.1)'}}>
          <ArrowL s={13} c="currentColor"/> Back
        </button>
        <div style={{display:'flex',alignItems:'center',gap:10}}><TaskBadge taskType={activeTask.taskType}/><span style={{fontWeight:800,fontSize:15,color:d.accent}}>+{d.pts} pts</span></div>
      </div>
      <div style={{textAlign:'center'}}><div style={{fontWeight:700,fontSize:15,color:'#fff',marginBottom:3}}>{activeTask.title}</div><div style={{fontSize:12,color:'#64748b'}}>{d.desc}</div></div>
      <div style={{borderRadius:14,overflow:'hidden',border:'1px solid rgba(255,255,255,.06)',boxShadow:`0 0 48px ${d.accent}18`,aspectRatio:'16/9',background:'#0d0d1f'}}>
        {videoId
          ? <iframe key={videoId} src={`https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`} style={{width:'100%',height:'100%',border:'none'}} allow="autoplay; encrypted-media" allowFullScreen/>
          : <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,color:'#64748b'}}>
              <span style={{fontSize:32}}>⚠️</span>
              <span style={{fontSize:13}}>Could not load video. Invalid URL.</span>
              <a href={activeTask.url} target="_blank" rel="noreferrer" style={{fontSize:12,color:'#a855f7'}}>Open on YouTube →</a>
            </div>
        }
      </div>
      <div style={{background:'#13132a',borderRadius:14,border:'1px solid rgba(255,255,255,.06)',padding:'20px 22px',display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <TimerRing timeLeft={timeLeft} totalTime={activeTask.watchDuration} done={timerDone}/>
          <span style={{fontSize:10,color:timerDone?'#4ade80':'#64748b',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>{timerDone?'✓ Done':'Watch Timer'}</span>
        </div>
        <div style={{flex:1,minWidth:200,display:'flex',flexDirection:'column',gap:12}}>
          {activeTask.taskType==='watch'&&<div style={{fontSize:13,color:timerDone?'#4ade80':'#94a3b8',display:'flex',alignItems:'center',gap:6}}>{timerDone?<><Check s={14} c="#4ade80"/> Watch complete!</>:<>Keep watching…</>}</div>}
          {activeTask.taskType==='subscribe'&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontSize:13,color:timerDone?'#fff':'#4b5563',display:'flex',alignItems:'center',gap:6}}><Bell s={13} c={timerDone?'#a855f7':'#4b5563'}/>{timerDone?'Subscribe to the channel:':` Subscribe unlocks in ${timeLeft}s…`}</div>
              {subStep==='idle'&&<button disabled={!timerDone} onClick={handleSubscribeOpen} className={timerDone?'pulse':''} style={{padding:'11px 16px',borderRadius:10,border:'none',fontFamily:'inherit',cursor:timerDone?'pointer':'not-allowed',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:8,background:timerDone?'linear-gradient(135deg,#ff0000,#cc0000)':'#1f2937',color:timerDone?'#fff':'#4b5563',boxShadow:timerDone?'0 0 20px rgba(255,0,0,.3)':'none',transition:'all .2s'}}><Youtube s={16} c="white"/> {timerDone?'▶ Subscribe on YouTube':`Locked — ${timeLeft}s remaining`}</button>}
              {subStep==='opened'&&<div style={{display:'flex',flexDirection:'column',gap:8}}><div style={{fontSize:12,color:'#94a3b8',padding:'8px 12px',background:'rgba(168,85,247,.08)',borderRadius:8,border:'1px solid rgba(168,85,247,.2)'}}>✅ YouTube opened. Subscribe then confirm below.</div><div style={{display:'flex',gap:8}}><button onClick={()=>setSubStep('done')} style={{flex:1,padding:'10px',borderRadius:9,border:'none',background:'linear-gradient(135deg,#16a34a,#15803d)',color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><Check s={13} c="#fff"/> Yes, Subscribed</button><button onClick={()=>setSubStep('idle')} style={{padding:'10px 14px',borderRadius:9,border:'1px solid rgba(255,255,255,.1)',background:'transparent',color:'#94a3b8',fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Not yet</button></div></div>}
              {subStep==='done'&&<div style={{fontSize:13,color:'#4ade80',display:'flex',alignItems:'center',gap:6,padding:'10px 14px',background:'rgba(22,163,74,.12)',borderRadius:9,border:'1px solid rgba(74,222,128,.2)'}}><Check s={14} c="#4ade80"/> Subscribed! Claim your points.</div>}
            </div>
          )}
          {activeTask.taskType==='comment'&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {/* Auto-post badge */}
              {timerDone && GOOGLE_YT_CLIENT_ID && (
                <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#ff4444',background:'rgba(255,0,0,.08)',border:'1px solid rgba(255,0,0,.2)',borderRadius:7,padding:'5px 10px'}}>
                  <Youtube s={12} c="#ff4444"/> Your comment will be posted to YouTube automatically
                </div>
              )}
              <div style={{fontSize:13,color:timerDone?'#fff':'#4b5563',display:'flex',alignItems:'center',gap:6}}>
                <MsgSq s={13} c={timerDone?'#f59e0b':'#4b5563'}/>
                {timerDone?'Write your comment below:':` Comment unlocks in ${timeLeft}s…`}
              </div>
              <textarea
                disabled={!timerDone || ytStatus==='posting' || claimed}
                value={comment} onChange={e=>setComment(e.target.value)}
                placeholder={timerDone?'Write a genuine comment about this video…':'Waiting for watch timer…'}
                rows={3}
                style={{padding:'10px 12px',borderRadius:8,border:`1px solid ${timerDone&&comment.trim()?'rgba(245,158,11,.5)':'rgba(255,255,255,.1)'}`,background:timerDone?'#0f0f1a':'#0a0a14',color:timerDone?'#fff':'#374151',fontSize:13,outline:'none',width:'100%',opacity:(ytStatus==='posting'||claimed)?.6:1}}/>

              {/* YouTube posting status */}
              {ytStatus==='posting' && (
                <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#ff4444',padding:'8px 12px',background:'rgba(255,0,0,.08)',borderRadius:8,border:'1px solid rgba(255,0,0,.2)'}}>
                  <div className="spinner" style={{width:13,height:13,borderTopColor:'#ff4444'}}/> Posting comment to YouTube…
                </div>
              )}
              {ytStatus==='posted' && (
                <div style={{display:'flex',alignItems:'center',gap:7,fontSize:12,color:'#4ade80',padding:'8px 12px',background:'rgba(22,163,74,.1)',borderRadius:8,border:'1px solid rgba(74,222,128,.2)'}}>
                  <Youtube s={13} c="#4ade80"/> ✓ Comment posted to YouTube successfully!
                </div>
              )}
              {ytStatus==='failed' && ytError && (
                <div style={{fontSize:11,color:'#f87171',padding:'7px 10px',background:'rgba(248,113,113,.08)',borderRadius:7,border:'1px solid rgba(248,113,113,.2)'}}>
                  ⚠ YouTube post failed: {ytError}. Points still awarded.
                </div>
              )}
            </div>
          )}

          {/* Claim button */}
          <button onClick={handleClaim} disabled={!canClaim || ytStatus==='posting'} style={{
            padding:'12px',borderRadius:11,border:'none',fontFamily:'inherit',
            fontWeight:700,fontSize:15,marginTop:4,
            cursor:(canClaim && ytStatus!=='posting')?'pointer':'not-allowed',
            background:claimed?'rgba(22,163,74,.2)':canClaim?`linear-gradient(135deg,${d.accent},${d.accent}99)`:'#1f2937',
            color:claimed?'#4ade80':canClaim?'#fff':'#4b5563',
            boxShadow:canClaim?`0 0 22px ${d.accent}44`:'none',
            transition:'all .2s',
            display:'flex',alignItems:'center',justifyContent:'center',gap:8,
          }}>
            {ytStatus==='posting' && <div className="spinner" style={{width:14,height:14}}/>}
            {claimed
              ? (ytStatus==='posted' ? `✓ Posted on YouTube · +${d.pts} pts!` : `✓ +${d.pts} pts earned!`)
              : ytStatus==='posting' ? 'Posting to YouTube…'
              : `Claim ${d.pts} Points`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Promote Tab ───────────────────────────────────────────────────────────────
function PromoteTab({ user, campaigns, onLaunch }) {
  const [url,setUrl]=useState('');
  const [chan,setChan]=useState('');
  const [type,setType]=useState('watch');
  const [dur,setDur]=useState(30);
  const [views,setViews]=useState(100);
  const d=TASK_DEFS[type], cost=views*d.costPerView;
  const can=url.trim().length>0&&(type==='watch'||chan.trim().length>0)&&user.points>=cost;

  function launch(){
    if(!can) return;
    const campData={ url:url.trim(), channelUrl:chan.trim()||url.trim(), title:`My Video #${Date.now().toString().slice(-4)}`, target:views, taskType:type, watchDuration:dur };
    // Reset form instantly
    setUrl('');setChan('');setType('watch');setDur(30);setViews(100);
    // Save in background
    onLaunch(campData, cost);
  }

  const mine=campaigns.filter(c=>c.ownerId===user.id);
  const lbl=(t,s)=><div style={{marginBottom:8}}><label style={{fontSize:13,color:'#94a3b8',fontWeight:600}}>{t}</label>{s&&<span style={{fontSize:11,color:'#4b5563',marginLeft:6}}>{s}</span>}</div>;
  const ti=(val,set,ph)=><input type="text" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={{width:'100%',padding:'11px 14px',borderRadius:9,border:'1px solid rgba(255,255,255,.1)',background:'#0f0f1a',color:'#fff',fontSize:13,outline:'none',fontFamily:'inherit',marginBottom:16}}/>;

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:22}}>
      <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:16,padding:22}}>
        <h2 style={{fontSize:17,fontWeight:700,color:'#fff',marginBottom:18,display:'flex',alignItems:'center',gap:8}}><Rocket s={17} c="#a855f7"/> Launch a Campaign</h2>
        {lbl('YouTube Video URL','(required)')}{ti(url,setUrl,'https://youtube.com/watch?v=...')}
        {lbl('Your Channel URL',type!=='watch'?'(required)':'(optional)')}{ti(chan,setChan,'https://youtube.com/@YourChannel')}
        <div style={{marginBottom:18}}>
          {lbl('Task Type for Viewers')}
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {Object.entries(TASK_DEFS).map(([k,td])=>{const a=type===k;return(
              <div key={k} onClick={()=>setType(k)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:9,border:`1px solid ${a?td.accent+'60':'rgba(255,255,255,.07)'}`,background:a?`${td.accent}10`:'#0f0f1a',cursor:'pointer',transition:'all .15s'}}>
                <div style={{display:'flex',alignItems:'center',gap:9}}><span style={{fontSize:18}}>{td.emoji}</span><div><div style={{fontWeight:700,fontSize:13,color:a?td.accent:'#fff'}}>{td.label}</div><div style={{fontSize:11,color:'#4b5563'}}>{td.desc}</div></div></div>
                <div style={{textAlign:'right'}}><div style={{fontWeight:800,fontSize:13,color:a?td.accent:'#64748b'}}>{td.costPerView} pts/view</div><div style={{fontSize:10,color:'#4b5563'}}>earns {td.pts} pts</div></div>
              </div>
            );})}
          </div>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><label style={{fontSize:13,color:'#94a3b8',fontWeight:600,display:'flex',alignItems:'center',gap:5}}><Clock s={12} c="#94a3b8"/> Watch Time</label><span style={{fontSize:13,fontWeight:700,color:'#22d3ee'}}>{dur}s</span></div>
          <input type="range" min={15} max={120} step={15} value={dur} onChange={e=>setDur(Number(e.target.value))}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:10,color:'#374151'}}>{[15,30,45,60,75,90,105,120].map(v=><span key={v}>{v}s</span>)}</div>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><label style={{fontSize:13,color:'#94a3b8',fontWeight:600,display:'flex',alignItems:'center',gap:5}}><Eye s={12} c="#94a3b8"/> Views to Buy</label><span style={{fontSize:13,fontWeight:700,color:'#22d3ee'}}>{views}</span></div>
          <input type="range" min={10} max={500} step={10} value={views} onChange={e=>setViews(Number(e.target.value))}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:10,color:'#374151'}}><span>10</span><span>500</span></div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#0f0f1a',borderRadius:9,padding:'11px 14px',marginBottom:18}}>
          <div><div style={{fontSize:11,color:'#4b5563'}}>Total cost</div><div style={{fontSize:11,color:'#374151'}}>{views} × {d.costPerView} pts</div></div>
          <span style={{fontWeight:800,fontSize:20,color:cost>user.points?'#ef4444':d.accent,display:'flex',alignItems:'center',gap:6}}><Coins s={15} c="#f59e0b"/>{cost.toLocaleString()} pts</span>
        </div>
        <button onClick={launch} disabled={!can} style={{width:'100%',padding:'13px',borderRadius:11,border:'none',fontFamily:'inherit',fontWeight:700,fontSize:15,cursor:can?'pointer':'not-allowed',background:can?`linear-gradient(135deg,${d.accent},${d.accent}99)`:'#1f2937',color:can?'#fff':'#4b5563',boxShadow:can?`0 0 24px ${d.accent}44`:'none',transition:'all .2s'}}>
          {!url.trim()?'Paste a URL to continue':(type!=='watch'&&!chan.trim())?'Add your channel URL':user.points<cost?'Not enough points':`🚀 Launch — ${cost.toLocaleString()} pts`}
        </button>
      </div>
      {mine.length>0&&(
        <div>
          <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><BarChart s={14} c="#22d3ee"/> My Active Campaigns</h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>{mine.map(c=><CampaignCard key={c.id} campaign={c}/>)}</div>
        </div>
      )}
    </div>
  );
}

// ── Dashboard Tab ─────────────────────────────────────────────────────────────

    fetchEarnHistory(user.id).then(setHistory);
    fetchPurchases(user.id).then(setPurchases);
  },[user.id]);

  const totalEarned    = (history||[]).reduce((s,h)=>s+h.pts,0);
  const totalPurchased = (purchases||[]).reduce((s,p)=>s+p.pts,0);
  const totalSpent     = mine.reduce((s,c)=>s+(c.target*(TASK_DEFS[c.taskType]?.costPerView||5)),0);
  const icons={watch:'👁️',subscribe:'🔔',comment:'💬'};
  const Loader = ()=><div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'28px 0',color:'#374151',fontSize:13}}><div className="spinner" style={{width:14,height:14}}/> Loading…</div>;

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:24}}>

      {/* ── Profile Card ── */}
      <div style={{background:'linear-gradient(135deg,#1a0f2e 0%,#0f1a1a 100%)',border:'1px solid rgba(168,85,247,.25)',borderRadius:18,padding:'28px 28px',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-40,right:-40,width:160,height:160,background:'radial-gradient(circle,rgba(168,85,247,.12),transparent 70%)',pointerEvents:'none'}}/>
        <div style={{display:'flex',alignItems:'flex-start',gap:20,flexWrap:'wrap'}}>
          {/* Avatar */}
          <div style={{width:76,height:76,borderRadius:999,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,fontWeight:800,color:'#fff',flexShrink:0,boxShadow:'0 0 24px rgba(168,85,247,.4)'}}>{initials(user.name)}</div>
          {/* Info */}
          <div style={{flex:1,minWidth:200}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4,flexWrap:'wrap'}}>
              <h2 style={{fontSize:22,fontWeight:800,color:'#fff'}}>{user.name||'ViewBoost User'}</h2>
              <span style={{background:'rgba(74,222,128,.12)',color:'#4ade80',border:'1px solid rgba(74,222,128,.25)',borderRadius:999,padding:'2px 10px',fontSize:11,fontWeight:700}}>✓ Verified</span>
            </div>
            <div style={{fontSize:13,color:'#64748b',marginBottom:6}}>{user.email}</div>
            <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:'#4b5563',display:'flex',alignItems:'center',gap:5}}><Clock s={11} c="#4b5563"/> Member since {fmtDate(user.created_at||Date.now())}</span>
              <span style={{fontSize:12,color:'#3ecf8e',display:'flex',alignItems:'center',gap:5}}>⚡ Powered by Supabase</span>
            </div>
          </div>
          {/* Balance */}
          <div style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(245,158,11,.2)',borderRadius:14,padding:'14px 20px',textAlign:'center',flexShrink:0}}>
            <div style={{fontSize:11,color:'#64748b',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Current Balance</div>
            <div style={{fontSize:32,fontWeight:800,color:'#f59e0b',display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}><Coins s={22} c="#f59e0b"/>{(user.points||0).toLocaleString()}</div>
            <div style={{fontSize:11,color:'#64748b',marginTop:4}}>points</div>
          </div>
        </div>
      </div>

      {/* ── Points Summary ── */}
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><Coins s={14} c="#f59e0b"/> Points Details</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
          {[
            {icon:'💰',label:'Current Balance',val:(user.points||0).toLocaleString(),col:'#f59e0b',sub:'available to spend'},
            {icon:'📈',label:'Total Earned',   val:`+${totalEarned.toLocaleString()}`,col:'#4ade80',sub:'from completed tasks'},
            {icon:'🛒',label:'Total Purchased', val:`+${totalPurchased.toLocaleString()}`,col:'#22d3ee',sub:'from point packages'},
            {icon:'📤',label:'Spent on Campaigns',val:`-${totalSpent.toLocaleString()}`,col:'#f87171',sub:'campaigns launched'},
          ].map(s=>(
            <div key={s.label} style={{background:'#1a1a2e',border:`1px solid ${s.col}20`,borderRadius:12,padding:'16px 14px'}}>
              <div style={{fontSize:22,marginBottom:8}}>{s.icon}</div>
              <div style={{fontSize:20,fontWeight:800,color:s.col,marginBottom:2}}>{s.val} <span style={{fontSize:11,color:'#64748b'}}>pts</span></div>
              <div style={{fontSize:11,color:'#64748b',fontWeight:600}}>{s.label}</div>
              <div style={{fontSize:10,color:'#374151',marginTop:2}}>{s.sub}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Activity Stats ── */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        {[['✅','Tasks Done',(history||[]).length,'#4ade80'],['🚀','Active Campaigns',active,'#a855f7'],['📅','Total Campaigns',mine.length,'#22d3ee'],['🎯','Completion Rate',mine.length?`${Math.round(mine.filter(c=>c.delivered>=c.target).length/mine.length*100)}%`:'—','#f59e0b']].map(([ic,lb,val,col])=>(
          <div key={lb} style={{flex:1,minWidth:120,background:'#1a1a2e',border:`1px solid ${col}20`,borderRadius:12,padding:'14px',textAlign:'center'}}>
            <div style={{fontSize:22,marginBottom:5}}>{ic}</div>
            <div style={{fontSize:20,fontWeight:800,color:col}}>{val}</div>
            <div style={{fontSize:11,color:'#64748b',marginTop:2}}>{lb}</div>
          </div>
        ))}
      </div>

      {/* ── Bonus Rewards — Coming Soon ── */}
      <div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <h3 style={{fontSize:14,fontWeight:700,color:'#fff',display:'flex',alignItems:'center',gap:7}}>
            🎁 Bonus Rewards
          </h3>
          <span style={{background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontSize:10,fontWeight:800,padding:'3px 12px',borderRadius:999,boxShadow:'0 0 12px rgba(168,85,247,.4)'}}>Coming Soon</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:10}}>
          {[
            {icon:'📅',name:'Monthly Bonus',desc:'Earn bonus points every month just for being active',color:'#a855f7'},
            {icon:'📆',name:'Weekly Bonus',desc:'Log in each week to collect your weekly reward',color:'#22d3ee'},
            {icon:'👑',name:'VIP Bonus',desc:'Exclusive rewards unlocked as you level up your status',color:'#f59e0b'},
            {icon:'🎂',name:'Birthday Bonus',desc:'A special gift of points on your birthday every year',color:'#f87171'},
          ].map(b=>(
            <div key={b.name} style={{background:'#1a1a2e',border:`1px solid ${b.color}20`,borderRadius:13,padding:'16px',position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:0,right:0,background:`${b.color}15`,width:60,height:60,borderRadius:'0 13px 0 60px'}}/>
              <div style={{fontSize:26,marginBottom:8}}>{b.icon}</div>
              <div style={{fontWeight:700,fontSize:13,color:'#fff',marginBottom:4}}>{b.name}</div>
              <div style={{fontSize:11,color:'#64748b',lineHeight:1.5,marginBottom:10}}>{b.desc}</div>
              <div style={{display:'inline-flex',alignItems:'center',gap:5,background:`${b.color}12`,border:`1px solid ${b.color}30`,borderRadius:999,padding:'3px 10px',fontSize:10,fontWeight:700,color:b.color}}>
                🔒 Coming Soon
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:10,padding:'10px 14px',background:'rgba(168,85,247,.05)',border:'1px solid rgba(168,85,247,.12)',borderRadius:10,fontSize:12,color:'#64748b',textAlign:'center'}}>
          Point allocations for bonus rewards will be announced soon. Stay tuned! 🚀
        </div>
      </div>

      {/* ── Purchase History ── */}
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><ShoppingB s={14} c="#22d3ee"/> Purchase History</h3>
        {purchases===null ? <Loader/> : purchases.length===0
          ? <div style={{textAlign:'center',padding:'24px',background:'#1a1a2e',borderRadius:12,color:'#374151',fontSize:13}}>No purchases yet. Check the <strong style={{color:'#94a3b8'}}>Buy Points</strong> section when paid plans launch.</div>
          : <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,overflow:'hidden'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 120px 120px 80px',padding:'10px 16px',background:'rgba(255,255,255,.03)',borderBottom:'1px solid rgba(255,255,255,.06)',fontSize:11,fontWeight:700,color:'#4b5563',textTransform:'uppercase',letterSpacing:'0.05em'}}>
                <span>Package</span><span style={{textAlign:'center'}}>Points</span><span style={{textAlign:'right'}}>Amount</span><span style={{textAlign:'right'}}>Date</span>
              </div>
              {purchases.map((p,i)=>(
                <div key={p.id} style={{display:'grid',gridTemplateColumns:'1fr 120px 120px 80px',padding:'12px 16px',borderBottom:i<purchases.length-1?'1px solid rgba(255,255,255,.04)':'none',alignItems:'center'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:32,height:32,borderRadius:8,background:'linear-gradient(135deg,#a855f720,#22d3ee20)',border:'1px solid rgba(168,85,247,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🛒</div>
                    <div><div style={{fontWeight:700,fontSize:13,color:'#fff'}}>{p.package_name} Pack</div><div style={{fontSize:11,color:'#64748b'}}>{fmtTime(p.purchased_at)}</div></div>
                  </div>
                  <div style={{textAlign:'center',fontWeight:700,fontSize:13,color:'#f59e0b',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}><Coins s={11} c="#f59e0b"/>+{(p.pts||0).toLocaleString()}</div>
                  <div style={{textAlign:'right',fontWeight:700,fontSize:13,color:'#4ade80'}}>${Number(p.price||0).toFixed(2)}</div>
                  <div style={{textAlign:'right',fontSize:11,color:'#64748b'}}>{fmtDate(p.purchased_at)}</div>
                </div>
              ))}
              <div style={{padding:'10px 16px',background:'rgba(255,255,255,.02)',borderTop:'1px solid rgba(255,255,255,.06)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:12,color:'#64748b'}}>{purchases.length} purchase{purchases.length!==1?'s':''}</span>
                <span style={{fontSize:13,fontWeight:800,color:'#f59e0b',display:'flex',alignItems:'center',gap:5}}><Coins s={13} c="#f59e0b"/>+{totalPurchased.toLocaleString()} pts total</span>
              </div>
            </div>}
      </div>

      {/* ── Earnings History ── */}
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><Trophy s={14} c="#f59e0b"/> Earnings History</h3>
        {history===null ? <Loader/> : history.length===0
          ? <div style={{textAlign:'center',padding:'24px',background:'#1a1a2e',borderRadius:12,color:'#374151',fontSize:13}}>No earnings yet. Complete tasks to start earning!</div>
          : <div style={{background:'#1a1a2e',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,overflow:'hidden'}}>
              {history.slice(0,15).map((h,i)=>(
                <div key={h.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'12px 16px',borderBottom:i<Math.min(history.length,15)-1?'1px solid rgba(255,255,255,.04)':'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:34,height:34,borderRadius:9,background:`${TASK_DEFS[h.task_type]?.accent||'#a855f7'}15`,border:`1px solid ${TASK_DEFS[h.task_type]?.accent||'#a855f7'}30`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>{icons[h.task_type]||'⚡'}</div>
                    <div><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{h.campaign_title}</div><div style={{fontSize:11,color:'#64748b',marginTop:1}}>{TASK_DEFS[h.task_type]?.label} · {fmtDate(h.earned_at)} at {fmtTime(h.earned_at)}</div></div>
                  </div>
                  <span style={{fontWeight:800,fontSize:14,color:'#4ade80',whiteSpace:'nowrap'}}>+{h.pts} pts</span>
                </div>
              ))}
              {history.length>15&&<div style={{padding:'10px 16px',textAlign:'center',fontSize:12,color:'#4b5563',borderTop:'1px solid rgba(255,255,255,.04)'}}>{history.length-15} more earnings…</div>}
            </div>}
      </div>

      {/* ── Campaign History ── */}
      <div>
        <h3 style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:12,display:'flex',alignItems:'center',gap:7}}><BarChart s={14} c="#22d3ee"/> My Campaigns</h3>
        {mine.length===0
          ? <div style={{textAlign:'center',padding:'24px',background:'#1a1a2e',borderRadius:12,color:'#374151',fontSize:13}}>No campaigns yet. Go to Promote to launch one!</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>{mine.map(c=>(
              <div key={c.id}><CampaignCard campaign={c} compact/><div style={{fontSize:10,color:'#374151',marginTop:3,paddingLeft:4}}>Created {fmtDate(c.createdAt)}</div></div>
            ))}</div>}
      </div>

    </div>
  );
}

// ── Footer ────────────────────────────────────────────────────────────────────
function Footer({ onOpenPage }) {
  return (
    <footer style={{borderTop:'1px solid rgba(255,255,255,.06)',marginTop:48,padding:'24px 20px'}}>
      <div style={{maxWidth:960,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:22,height:22,borderRadius:5,background:'linear-gradient(135deg,#a855f7,#22d3ee)',display:'flex',alignItems:'center',justifyContent:'center'}}><Play s={10} c="#fff" fill="#fff"/></div>
          <span style={{fontWeight:800,fontSize:15,color:'#fff'}}>View<span style={{color:'#a855f7'}}>Boost</span></span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',justifyContent:'center'}}>
          {[['about','About Us'],['privacy','Privacy Policy'],['terms','Terms & Conditions']].map(([key,label],i,arr)=>(
            <React.Fragment key={key}>
              <button onClick={()=>onOpenPage(key)} style={{background:'none',border:'none',color:'#64748b',fontSize:13,cursor:'pointer',fontFamily:'inherit',padding:'2px 4px',transition:'color .15s'}}
                onMouseEnter={e=>e.target.style.color='#a855f7'} onMouseLeave={e=>e.target.style.color='#64748b'}>{label}</button>
              {i<arr.length-1&&<span style={{color:'#2d2d4e',fontSize:13}}>·</span>}
            </React.Fragment>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap',justifyContent:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,background:'rgba(62,207,142,.06)',border:'1px solid rgba(62,207,142,.15)',borderRadius:7,padding:'4px 12px',fontSize:11,color:'#3ecf8e'}}>
            <span style={{fontWeight:700}}>⚡</span> Powered by Supabase
          </div>
          <span style={{fontSize:11,color:'#2d2d4e'}}>© {new Date().getFullYear()} ViewBoost. All rights reserved.</span>
        </div>
      </div>
    </footer>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user,       setUser]       = useState(null);
  const [initLoading,setInitLoading]= useState(true);
  const [tab,        setTab]        = useState('discover');
  const [camps,      setCamps]      = useState([]);
  const [task,       setTask]       = useState(null);
  const [checkout,   setCheckout]   = useState(null);
  const [footerPage, setFooterPage] = useState(null);

  useEffect(()=>{
    let mounted=true;
    // Init Google YouTube auth when GIS script has loaded
    const gisInterval = setInterval(()=>{
      if(window.google?.accounts?.oauth2){ initYTAuth(); clearInterval(gisInterval); }
    }, 500);
    setTimeout(()=>clearInterval(gisInterval), 10000); // stop polling after 10s

    async function init() {
      try {
        fetchCampaigns().then(data=>{ if(mounted) setCamps(data); }).catch(()=>{});
        // Use direct localStorage read — no network call, instant
        const authUser = await authGetSession();
        if(authUser && mounted){
          const profile = await fetchProfile(authUser.id).catch(()=>null);
          const def = { name: authUser.user_metadata?.name || authUser.email?.split('@')[0] || '', points:null, tasks_completed:0, total_earned:0, created_at:new Date().toISOString() };
          if(mounted) setUser({ id:authUser.id, email:authUser.email, ...(profile||def) });
        }
      } catch(e) {
        console.warn('Init error:', e.message);
      } finally {
        if(mounted) setInitLoading(false);
      }
    }
    init();

    return ()=>{ mounted=false; };
  },[]);

  function setActiveTask(t){ setTask(t); if(t) setTab('earn'); }

  // Earn: atomic DB increment — never reads current balance, just adds to it
  function handleClaim(task, pts) {
    if(!user) return;
    // Optimistic UI — add to whatever the display shows
    setUser(u=>({...u,
      points: (u.points||0)+pts,
      tasks_completed: (u.tasks_completed||0)+1,
      total_earned: (u.total_earned||0)+pts,
    }));
    // Atomic DB increment via RPC — safe even if client state was stale
    supa.rpc('earn_points', { uid: user.id, amount: pts })
      .then(({ data: newBalance }) => {
        // Sync UI with DB's authoritative value
        if(newBalance != null) setUser(u=>({...u, points: newBalance}));
      })
      .catch(()=>{});
    // Log to earn_history in background
    supa.from('earn_history').insert({
      user_id:user.id, campaign_id:task.id,
      campaign_title:task.title, task_type:task.taskType, pts,
    }).catch(()=>{});
  }

  // Promote: atomic DB spend — never reads current balance
  function handleLaunch(campData, cost) {
    if(!user) return;
    // Optimistic UI deduction
    setUser(u=>({...u, points: Math.max(0,(u.points||0)-cost)}));
    // Add temp campaign card instantly
    const tempId=`tmp_${Date.now()}`;
    setCamps(prev=>[{
      id:tempId, ownerId:user.id, url:campData.url, channelUrl:campData.channelUrl,
      title:campData.title, target:campData.target, delivered:0,
      taskType:campData.taskType, watchDuration:campData.watchDuration, createdAt:Date.now()
    },...prev]);
    // Atomic spend + save campaign in parallel
    Promise.all([
      supa.rpc('spend_points', { uid: user.id, amount: cost })
        .then(({ data: newBalance }) => {
          // Sync with authoritative DB value
          if(newBalance != null && newBalance >= 0) setUser(u=>({...u, points: newBalance}));
        }),
      supa.from('campaigns').insert({
        owner_id:user.id, url:campData.url, channel_url:campData.channelUrl,
        title:campData.title, target:campData.target, delivered:0,
        task_type:campData.taskType, watch_duration:campData.watchDuration,
      }).select().single().then(({data})=>{
        if(data) setCamps(prev=>prev.map(c=>c.id===tempId?mapCamp(data):c));
      }),
    ]).catch(()=>{});
  }

  if(initLoading) return <LoadingScreen/>;
  if(!user) return <LoginScreen onLogin={u=>{setUser(u);setTab('discover');}}/>;

  if(checkout) return (
    <CheckoutPage pkg={checkout} user={user}
      onUpdatePoints={pts=>setUser(u=>({...u,points:pts}))}
      onBack={()=>setCheckout(null)}
      onSuccess={()=>{ setCheckout(null); setTab('promote'); }}
    />
  );

  const FOOTER_CONTENT = {
    privacy:{ title:'Privacy Policy', icon:'🔒', lastUpdated:'May 8, 2026', sections:[{heading:'Information We Collect',body:'When you create a ViewBoost account we collect your name, email address, and password (secured by Supabase Auth with bcrypt hashing). We store campaigns you create, tasks you complete, and your points balance in a Supabase Postgres database.'},{heading:'Data Storage',body:'All data is stored in Supabase (eu-west-1 region). Data is encrypted at rest and in transit using TLS 1.3. Your password is never stored in plain text.'},{heading:'YouTube Integration',body:'When you complete a "Watch + Subscribe" task, ViewBoost opens YouTube\'s official subscription page. We do not access your YouTube credentials.'},{heading:'Your Rights',body:'You may request account deletion at any time. Contact privacy@viewboost.io.'}]},
    terms:{ title:'Terms & Conditions', icon:'📋', lastUpdated:'May 8, 2026', sections:[{heading:'Acceptance',body:'By creating a ViewBoost account you agree to these Terms. We reserve the right to update them with notice.'},{heading:'Prohibited Activities',body:'No bots, multiple accounts, false confirmations, or fraudulent activity. Violations result in account termination.'},{heading:'Points',body:'Points have no monetary value and cannot be exchanged for cash.'},{heading:'Contact',body:'legal@viewboost.io'}]},
    about:{ title:'About ViewBoost', icon:'🚀', lastUpdated:null, sections:[{heading:'What is ViewBoost?',body:'ViewBoost is a community-powered view-for-view exchange platform for YouTube creators, built with React and Supabase.'},{heading:'Mission',body:'Building a level playing field for creators through genuine engagement — watch, subscribe, comment.'},{heading:'Technology',body:'React frontend, Supabase Auth + Postgres backend, Row Level Security for data privacy, real-time sync across devices.'},{heading:'Contact',body:'hello@viewboost.io'}]},
  };
  const fp = FOOTER_CONTENT[footerPage];

  return (
    <div style={{background:'#0f0f1a',minHeight:'100vh',color:'#fff',display:'flex',flexDirection:'column'}}>
      <Header user={user} onLogoClick={()=>{ setTab('discover'); setTask(null); }} onLogout={()=>{ authSignOut(); setUser(null); setTab('discover'); setTask(null); }}/>
      <div style={{maxWidth:960,margin:'0 auto',padding:'0 20px 0',width:'100%',flex:1}}>
        <TabBar activeTab={tab} setActiveTab={t=>{setTab(t);if(t!=='earn')setTask(null);}}/>
        <div style={{marginTop:22,paddingBottom:16}}>
          {tab==='discover'  && <DiscoverTab user={user} campaigns={camps} setActiveTab={setTab} setActiveTask={setActiveTask} onCheckout={setCheckout}/>}
          {tab==='earn'      && <EarnTab user={user} campaigns={camps} onClaim={handleClaim} activeTask={task} setActiveTask={setActiveTask}/>}
          {tab==='promote'   && <PromoteTab user={user} campaigns={camps} onLaunch={handleLaunch}/>}
          {tab==='dashboard' && <DashboardTab user={user} campaigns={camps}/>}
        </div>
      </div>
      <Footer onOpenPage={setFooterPage}/>
      {fp&&(
        <div className="fade-in" style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:2000,overflowY:'auto',padding:'24px 16px'}} onClick={e=>{if(e.target===e.currentTarget)setFooterPage(null);}}>
          <div className="fade-up" style={{maxWidth:680,margin:'0 auto',background:'#13132a',border:'1px solid rgba(255,255,255,.08)',borderRadius:18,overflow:'hidden'}}>
            <div style={{background:'linear-gradient(135deg,#1e1140,#13132a)',padding:'24px 28px',borderBottom:'1px solid rgba(255,255,255,.06)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}><span style={{fontSize:28}}>{fp.icon}</span><div><h2 style={{fontSize:20,fontWeight:800,color:'#fff'}}>{fp.title}</h2>{fp.lastUpdated&&<div style={{fontSize:11,color:'#4b5563',marginTop:2}}>Last updated: {fp.lastUpdated}</div>}</div></div>
              <button onClick={()=>setFooterPage(null)} style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,width:32,height:32,color:'#94a3b8',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>
            <div style={{padding:'28px',display:'flex',flexDirection:'column',gap:22}}>
              {fp.sections.map((s,i)=><div key={i}><h3 style={{fontSize:14,fontWeight:700,color:'#a855f7',marginBottom:7,display:'flex',alignItems:'center',gap:7}}><span style={{display:'inline-block',width:4,height:14,background:'#a855f7',borderRadius:2}}/>{s.heading}</h3><p style={{fontSize:13,color:'#94a3b8',lineHeight:1.7}}>{s.body}</p></div>)}
            </div>
            <div style={{padding:'16px 28px',borderTop:'1px solid rgba(255,255,255,.06)',display:'flex',justifyContent:'flex-end'}}><button onClick={()=>setFooterPage(null)} style={{padding:'9px 24px',borderRadius:9,border:'none',background:'linear-gradient(135deg,#a855f7,#7c3aed)',color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Close</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
